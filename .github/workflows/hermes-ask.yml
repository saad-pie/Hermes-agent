name: Hermes Ask Agent

on:
  repository_dispatch:
    types: [hermes_request]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      question:
        description: "Question or Prompt for Hermes Agent"
        required: true
        type: string
      model:
        description: "Optional custom model override (e.g. gemini-3.5-flash)"
        required: false
        type: string
      user_id:
        description: "Firebase UID or User Identifier for Isolated Memory"
        required: false
        type: string
      file_url:
        description: "Optional Direct URL to a file/image/PDF/code asset to ingest"
        required: false
        type: string
      file_base64:
        description: "Optional Base64 encoded file upload content"
        required: false
        type: string
      file_name:
        description: "Filename for the Base64 uploaded file"
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

jobs:
  hermes-ask:
    if: ${{ (github.event_name == 'repository_dispatch') || (github.event_name == 'workflow_dispatch') || (contains(github.event.comment.body, '/ask') && !github.event.comment.user.bot) }}
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Extract PR Ref Context
        if: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request }}
        id: pr_data
        run: |
          PR_URL="${{ github.event.issue.pull_request.url }}"
          PR_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$PR_URL")
          HEAD_REF=$(echo "$PR_JSON" | jq -r .head.ref)
          echo "HEAD_REF=$HEAD_REF" >> $GITHUB_ENV

      - name: Checkout Workspace
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_REF || github.ref }}
          fetch-depth: 0

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore Pre-Built Hermes Cache
        uses: actions/cache/restore@v4
        id: restore-master-cache
        with:
          path: |
            /opt/hostedtoolcache/Python/3.11.*/x64
            ~/.cache/pip
            ~/.cache/ms-playwright
            ~/.local/bin
            ~/.hermes
          key: hermes-dagi-master-cache-v1

      - name: Export Executable Paths
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.hermes/bin" >> $GITHUB_PATH

      - name: Fetch Models & Auto-Select Active Model
        id: fetch_models
        run: |
          MODELS_JSON=$(curl -s "https://antigravity-seven-delta.vercel.app/api/models")
          echo "$MODELS_JSON" > /tmp/available_models.json

          ACTIVE_MODELS=$(echo "$MODELS_JSON" | jq -r '.data[] | select(.rpm > 0 and .rpd > 0) | .id')
          echo "Active available models:"
          echo "$ACTIVE_MODELS"

          TARGET_MODEL=""
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            TARGET_MODEL='${{ github.event.client_payload.model }}'
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TARGET_MODEL='${{ inputs.model }}'
          elif [ "${{ github.event_name }}" == "issue_comment" ]; then
            EXTRACTED_MODEL=$(echo '${{ github.event.comment.body }}' | grep -oE '--model[ =][a-zA-Z0-9.-]+' | awk '{print $2}' || true)
            if [ -n "$EXTRACTED_MODEL" ]; then
              TARGET_MODEL="$EXTRACTED_MODEL"
            fi
          fi

          if [ -z "$TARGET_MODEL" ] || ! echo "$ACTIVE_MODELS" | grep -q "^${TARGET_MODEL}$"; then
            if echo "$ACTIVE_MODELS" | grep -q "^gemini-3.1-flash-lite$"; then
              TARGET_MODEL="gemini-3.1-flash-lite"
            else
              TARGET_MODEL=$(echo "$ACTIVE_MODELS" | head -n 1)
            fi
          fi

          echo "SELECTED_MODEL=$TARGET_MODEL" >> $GITHUB_ENV
          echo "Selected Model: $TARGET_MODEL"

      - name: Configure Hermes Endpoint Binding
        run: |
          mkdir -p $HOME/.hermes
          cat << CONFIG > $HOME/.hermes/config.yaml
          provider: openai
          model: ${{ env.SELECTED_MODEL }}
          stream: true
          providers:
            openai:
              base_url: https://antigravity-seven-delta.vercel.app/v1
              api_key: dummy-token
          CONFIG

      - name: Resolve User Context & Restore Memory
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            USER_ID='${{ github.event.client_payload.user_id }}'
          elif [ "${{ github.event_name }}" == "issue_comment" ]; then
            USER_ID="${{ github.event.comment.user.login }}"
          elif [ -n "${{ inputs.user_id }}" ]; then
            USER_ID="${{ inputs.user_id }}"
          fi

          [ -z "$USER_ID" ] && USER_ID="public_user"
          USER_ID=$(echo "$USER_ID" | sed 's/[^a-zA-Z0-9_-]/_/g')
          echo "ACTIVE_USER_ID=$USER_ID" >> $GITHUB_ENV

          USER_DIR="./.hermes/users/$USER_ID"
          mkdir -p $HOME/.hermes/skills $HOME/.hermes/memory $HOME/.hermes/fts5 ./workspace/downloads "$USER_DIR/skills" "$USER_DIR/memory" "$USER_DIR/files"

          if [ -d "$USER_DIR/skills" ]; then cp -r "$USER_DIR/skills/"* $HOME/.hermes/skills/ 2>/dev/null || true; fi
          if [ -d "$USER_DIR/memory" ]; then cp -r "$USER_DIR/memory/"* $HOME/.hermes/memory/ 2>/dev/null || true; fi
          if [ -d "$USER_DIR/files" ]; then cp -r "$USER_DIR/files/"* ./workspace/downloads/ 2>/dev/null || true; fi

      - name: Resolve Question & Ingest File Uploads
        id: parse_question
        run: |
          USER_FILES="./.hermes/users/$ACTIVE_USER_ID/files"
          mkdir -p ./workspace/downloads "$USER_FILES"

          QUESTION=""
          
          # 1. Handle Repository Dispatch payloads (API / Web UI uploads)
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            QUESTION='${{ github.event.client_payload.question }}'
            FILE_URL='${{ github.event.client_payload.file_url }}'
            FILE_BASE64='${{ github.event.client_payload.file_base64 }}'
            FILE_NAME='${{ github.event.client_payload.file_name }}'

            if [ -n "$FILE_URL" ]; then
              filename=$(basename "$FILE_URL" | cut -d? -f1)
              [ -z "$filename" ] && filename="uploaded_asset"
              curl -sL "$FILE_URL" -o "./workspace/downloads/$filename"
              cp "./workspace/downloads/$filename" "$USER_FILES/"
              QUESTION="$QUESTION (Ingested file downloaded to ./workspace/downloads/$filename)"
            fi

            if [ -n "$FILE_BASE64" ] && [ -n "$FILE_NAME" ]; then
              echo "$FILE_BASE64" | base64 -d > "./workspace/downloads/$FILE_NAME"
              cp "./workspace/downloads/$FILE_NAME" "$USER_FILES/"
              QUESTION="$QUESTION (Uploaded file decoded and saved to ./workspace/downloads/$FILE_NAME)"
            fi

          # 2. Handle Workflow Dispatch inputs (Manual triggers with optional file URL / Base64)
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            QUESTION='${{ inputs.question }}'
            FILE_URL='${{ inputs.file_url }}'
            FILE_BASE64='${{ inputs.file_base64 }}'
            FILE_NAME='${{ inputs.file_name }}'

            if [ -n "$FILE_URL" ]; then
              filename=$(basename "$FILE_URL" | cut -d? -f1)
              [ -z "$filename" ] && filename="uploaded_asset"
              curl -sL "$FILE_URL" -o "./workspace/downloads/$filename"
              cp "./workspace/downloads/$filename" "$USER_FILES/"
              QUESTION="$QUESTION (Ingested file downloaded to ./workspace/downloads/$filename)"
            fi

            if [ -n "$FILE_BASE64" ] && [ -n "$FILE_NAME" ]; then
              echo "$FILE_BASE64" | base64 -d > "./workspace/downloads/$FILE_NAME"
              cp "./workspace/downloads/$FILE_NAME" "$USER_FILES/"
              QUESTION="$QUESTION (Uploaded file decoded and saved to ./workspace/downloads/$FILE_NAME)"
            fi

          # 3. Handle Issue Comments (GitHub chat interface with URLs or attached markdown files)
          else
            COMMENT_BODY='${{ github.event.comment.body }}'
            QUESTION=$(echo "$COMMENT_BODY" | sed 's/\/ask//g' | sed -E 's/--model[ =][a-zA-Z0-9.-]+//g' | xargs)
            
            URLS=$(echo "$COMMENT_BODY" | grep -oE 'https://[^\s\)]+' || true)
            for url in $URLS; do
              filename=$(basename "$url" | cut -d? -f1)
              if [ -n "$filename" ]; then
                curl -sL "$url" -o "./workspace/downloads/$filename"
                cp "./workspace/downloads/$filename" "$USER_FILES/"
                QUESTION="$QUESTION (Ingested asset saved to ./workspace/downloads/$filename)"
              fi
            done
          fi

          EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "QUESTION<<$EOF_MARKER" >> $GITHUB_ENV
          echo "$QUESTION" >> $GITHUB_ENV
          echo "$EOF_MARKER" >> $GITHUB_ENV

      - name: Execute Hermes Chat Engine
        env:
          HERMES_PROVIDER: "openai"
          HERMES_MODEL: ${{ env.SELECTED_MODEL }}
          HERMES_STREAM: "true"
          OPENAI_BASE_URL: "https://antigravity-seven-delta.vercel.app/v1"
          OPENAI_API_KEY: "dummy-token"
          GITHUB_TOKEN: ${{ secrets.HERMES_PAT || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.HERMES_PAT || secrets.GITHUB_TOKEN }}
          HERMES_YOLO: "true"
          HERMES_AUTO_CREATE_SKILLS: "true"
          HERMES_REDIS_URL: "redis://localhost:6379"
          HERMES_MAX_TOKEN_BUDGET: "100000"
          HERMES_HUMAN_IN_THE_LOOP: "false"
          STEALTH_BROWSER_MODE: "true"
        run: |
          PROMPT="[User Context: $ACTIVE_USER_ID] $QUESTION. Available workspace files: $(ls -la ./workspace/downloads 2>/dev/null || echo 'None')"

          if command -v hermes &> /dev/null; then
            hermes chat -q "$PROMPT" --provider openai --model "${{ env.SELECTED_MODEL }}" 2>&1 | tee ask_execution.log
          elif [ -f "$HOME/.local/bin/hermes" ]; then
            $HOME/.local/bin/hermes chat -q "$PROMPT" --provider openai --model "${{ env.SELECTED_MODEL }}" 2>&1 | tee ask_execution.log
          else
            python3 -m hermes_agent chat -q "$PROMPT" --provider openai --model "${{ env.SELECTED_MODEL }}" 2>&1 | tee ask_execution.log || echo "Execution completed."
          fi

      - name: Secure Output-Only Attachment Parser & JSON Builder
        if: ${{ always() }}
        run: |
          if [ -f "ask_execution.log" ]; then
            sed -i -E 's/(ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]+|sk-[A-Za-z0-9]{32,})/[MASKED_SECRET]/g' ask_execution.log
          fi

          python3 - << 'EOF'
          import re, json, os, subprocess, datetime

          log_file = "ask_execution.log"
          raw_log = open(log_file, "r").read() if os.path.exists(log_file) else ""

          hermes_match = re.search(r'╭─ ⚕ Hermes ─+([\s\S]*?)╰─+', raw_log)
          clean_answer = hermes_match.group(1).strip() if hermes_match else raw_log.strip()

          thoughts = []
          for line in raw_log.split("\n"):
              line_str = line.strip()
              if any(k in line_str.lower() for k in ["searched", "executing", "running", "thought", "tool", "query"]):
                  now_str = datetime.datetime.now().strftime("%H:%M:%S")
                  thoughts.append({"timestamp": now_str, "action": re.sub(r'\x1b\[[0-9;]*m', '', line_str)[:120]})

          raw_repo = os.environ.get("GITHUB_REPOSITORY", "")
          ref_name = os.environ.get("HEAD_REF") or os.environ.get("GITHUB_REF_NAME", "main")
          attachments = []

          blacklisted_files = {
              "ask_execution.log", "hermes_execution.log", "agent_response.json",
              "package.json", "package-lock.json"
          }

          try:
              git_status = subprocess.check_output(["git", "status", "--porcelain"], text=True)
              for line in git_status.split("\n"):
                  if not line.strip():
                      continue
                  filepath = line.strip().split()[-1]
                  
                  if any(filepath.startswith(prefix) for prefix in [".git/", ".hermes/", "workspace/downloads/", "node_modules/", "/tmp/"]):
                      continue
                  if os.path.basename(filepath) in blacklisted_files:
                      continue

                  if os.path.isfile(filepath):
                      size_bytes = os.path.getsize(filepath)
                      size_str = f"{size_bytes / 1024:.1f} KB" if size_bytes > 1024 else f"{size_bytes} B"
                      raw_url = f"https://raw.githubusercontent.com/{raw_repo}/{ref_name}/{filepath}"
                      
                      _, ext = os.path.splitext(filepath)
                      file_type = ext.replace(".", "").upper() if ext else "FILE"

                      attachments.append({
                          "fileName": filepath,
                          "fileSize": size_str,
                          "fileType": file_type,
                          "downloadUrl": raw_url
                      })
          except Exception as e:
              print(f"Error detecting git files: {e}")

          payload = {
              "status": "completed",
              "user_id": os.environ.get("ACTIVE_USER_ID", "public_user"),
              "model": os.environ.get("SELECTED_MODEL", ""),
              "text_response": clean_answer,
              "thoughts": thoughts[:20],
              "attachments": attachments
          }

          with open("agent_response.json", "w") as f:
              json.dump(payload, f, indent=2)
          EOF

      - name: Upload Stream Output Artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hermes-execution-log
          path: agent_response.json
          retention-days: 1

      - name: Publish Comment
        if: ${{ always() && github.event_name == 'issue_comment' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let payload = { text_response: "No output generated.", attachments: [], thoughts: [] };
            if (fs.existsSync('agent_response.json')) {
              payload = JSON.parse(fs.readFileSync('agent_response.json', 'utf8'));
            }

            let attachmentsMd = "";
            if (payload.attachments && payload.attachments.length > 0) {
              attachmentsMd = "### 📄 Attached Artifacts\n" + payload.attachments.map(a => 
                `- 📎 [ **${a.fileName}** ](${a.downloadUrl}) (\`${a.fileType}\` • \`${a.fileSize}\`)`
              ).join("\n") + "\n\n";
            }

            let thoughtsMd = "";
            if (payload.thoughts && payload.thoughts.length > 0) {
              thoughtsMd = "<details><summary><b>🔍 View Execution Trace & Thoughts</b></summary>\n\n```text\n" + 
                payload.thoughts.map(t => `[${t.timestamp}] ${t.action}`).join("\n") + 
                "\n```\n</details>\n\n";
            }

            const body = `${attachmentsMd}${payload.text_response}\n\n${thoughtsMd}*User Context:* \`${process.env.ACTIVE_USER_ID}\` | *Active Model:* \`${process.env.SELECTED_MODEL}\``;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Save Memory & Workspace Artifacts
        if: ${{ always() }}
        run: |
          set +e
          USER_DIR="./.hermes/users/$ACTIVE_USER_ID"
          mkdir -p "$USER_DIR/skills" "$USER_DIR/memory" "$USER_DIR/files"

          cp -r $HOME/.hermes/skills/* "$USER_DIR/skills/" 2>/dev/null || true
          cp -r $HOME/.hermes/memory/* "$USER_DIR/memory/" 2>/dev/null || true

          git config --global user.name "Hermes Agent"
          git config --global user.email "hermes-agent@users.noreply.github.com"

          git fetch origin
          git checkout ${{ env.HEAD_REF || github.ref_name }}
          git pull --rebase origin ${{ env.HEAD_REF || github.ref_name }} || true

          git add .
          git reset ask_execution.log hermes_execution.log agent_response.json 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "chore(hermes): sync memory & workspace state for '$ACTIVE_USER_ID' [skip ci]"
            git push origin ${{ env.HEAD_REF || github.ref_name }}
          fi
          exit 0
