name: Hermes Ask Router Agent

on:
  repository_dispatch:
    types: [hermes_request]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      question:
        description: "Question or Prompt for Hermes Agent"
        required: true
        type: string
      model:
        description: "Optional custom model override"
        required: false
        type: string
      user_id:
        description: "User Identifier for Isolated Memory"
        required: false
        type: string
      target_layer:
        description: "Direct layer trigger override (claude, chatgpt, gemini, background, memory)"
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  route-and-dispatch:
    if: ${{ (github.event_name == 'repository_dispatch') || (github.event_name == 'workflow_dispatch') || (contains(github.event.comment.body, '/ask') && !github.event.comment.user.bot) }}
    runs-on: ubuntu-latest

    steps:
      - name: Restore Pre-Built Environment from Master Cache
        uses: actions/cache/restore@v4
        id: restore-master-cache
        with:
          path: |
            /opt/hostedtoolcache/Python/3.11.*/x64
            ~/.cache/pip
            ~/.cache/ms-playwright
            ~/.local/bin
            ~/.hermes
          key: hermes-dagi-master-cache-${{ runner.os }}-
          restore-keys: |
            hermes-dagi-master-cache-${{ runner.os }}-

      - name: Resolve Target Layer Workflow
        id: router
        env:
          RAW_PROMPT: ${{ github.event.client_payload.question || inputs.question || github.event.comment.body }}
          MANUAL_LAYER: ${{ inputs.target_layer }}
        run: |
          PROMPT_LOWER=$(echo "$RAW_PROMPT" | tr '[:upper:]' '[:lower:]')
          TARGET="claude-os.yml"

          if [ -n "$MANUAL_LAYER" ]; then
            case "$MANUAL_LAYER" in
              claude) TARGET="claude-os.yml" ;;
              chatgpt) TARGET="chatgpt-research.yml" ;;
              gemini) TARGET="gemini-workspace.yml" ;;
              background) TARGET="background-orchestrator.yml" ;;
              memory) TARGET="memory-sync.yml" ;;
            esac
          else
            if echo "$PROMPT_LOWER" | grep -qE "research|scrape|excel|xlsx|pdf|search|report"; then
              TARGET="chatgpt-research.yml"
            elif echo "$PROMPT_LOWER" | grep -qE "gmail|docs|calendar|drive|workspace|audio|video"; then
              TARGET="gemini-workspace.yml"
            elif echo "$PROMPT_LOWER" | grep -qE "cron|schedule|loop|retry|audit|background"; then
              TARGET="background-orchestrator.yml"
            elif echo "$PROMPT_LOWER" | grep -qE "memory|context|user state|vector|store"; then
              TARGET="memory-sync.yml"
            else
              TARGET="claude-os.yml"
            fi
          fi

          echo "DISPATCH_TARGET=$TARGET" >> $GITHUB_ENV
          echo "Target workflow selected: $TARGET"

      - name: Dispatch Worker Sub-Workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.HERMES_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const targetWorkflow = process.env.DISPATCH_TARGET;
            const question = process.env.RAW_PROMPT || "Default query executed by router";
            const userId = "${{ github.event.client_payload.user_id || inputs.user_id || github.event.comment.user.login || 'public_user' }}";
            
            console.log(`Dispatching ${targetWorkflow} for user ${userId}`);

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: targetWorkflow,
              ref: context.ref || 'main',
              inputs: {
                question: question,
                command: question,
                query: question,
                user_id: userId,
                action_type: "auto_routed",
                payload: JSON.stringify({ question, userId }),
                job_id: `job-${Date.now()}`,
                memory_payload: question
              }
            });
