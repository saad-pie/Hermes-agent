name: "Layer 3: Gemini Multimodal & Workspace Sync"

on:
  workflow_dispatch:
    inputs:
      action_type:
        description: "Type (gmail, calendar, drive, audio_vision)"
        required: true
        type: string
      payload:
        description: "JSON string payload"
        required: true
        type: string
      user_id:
        description: "User ID"
        required: false
        type: string
      model:
        description: "Model override"
        required: false
        type: string

permissions:
  contents: write
  issues: write

jobs:
  execute-gemini-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Master Environment Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /opt/hostedtoolcache/Python/3.11.*/x64
            ~/.cache/pip
            ~/.local/bin
            ~/.hermes
          key: hermes-dagi-master-cache-${{ runner.os }}-
          restore-keys: |
            hermes-dagi-master-cache-${{ runner.os }}-

      - name: Process Workspace Multimodal Workflow
        env:
          OPENAI_BASE_URL: "https://antigravity-seven-delta.vercel.app/v1"
          OPENAI_API_KEY: "dummy-token"
          GITHUB_TOKEN: ${{ secrets.HERMES_PAT || secrets.GITHUB_TOKEN }}
          HERMES_YOLO: "true"
        run: |
          export PATH="$HOME/.local/bin:$HOME/.hermes/bin:$PATH"
          PROMPT="Process Google Workspace / Multimodal action '${{ inputs.action_type }}' using payload: ${{ inputs.payload }}."
          hermes run --prompt "$PROMPT" --provider openai --yolo 2>&1 | tee workspace_execution.log || hermes chat -q "$PROMPT" --provider openai 2>&1 | tee workspace_execution.log
          
