name: "Layer 3 - Native Multimodal Ecosystem & Workspace Sync Worker"

on:
  workflow_dispatch:
    inputs:
      task_prompt:
        description: "Task prompt for Gemini Workspace and Multimodal execution"
        required: true
        type: string
        default: "Analyze attached documents, pull upcoming Google Calendar events, and draft a response email in Gmail."
      user_id:
        description: "Target user ID for isolated memory storage"
        required: false
        type: string
        default: "default_user"
      input_media_path:
        description: "Path to input video, audio, or high-res image file"
        required: false
        type: string
        default: ""

  repository_dispatch:
    types: [layer3_gemini_workspace]

jobs:
  execute-multimodal-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      USER_ID: ${{ inputs.user_id || github.event.client_payload.user_id || 'default_user' }}
      TASK_PROMPT: ${{ inputs.task_prompt || github.event.client_payload.task_prompt }}
      INPUT_MEDIA_PATH: ${{ inputs.input_media_path || github.event.client_payload.input_media_path || '' }}
      GCP_SA_KEY_BASE64: ${{ secrets.GCP_SA_KEY_BASE64 }}
      CUSTOM_PROXY_URL: "https://antigravity-seven-delta.vercel.v1"

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Restore Pre-Warmed Master Environment Cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/pip
            ~/.npm
            ~/.hermes/env
          key: hermes-dagi-master-cache-ubuntu-latest

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🛠️ Install Multimodal & Workspace Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr
          pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib
          pip install Pillow pytesseract requests google-genai
          pip install openai-whisper

      - name: 🔑 Configure Scoped OAuth2 Credentials
        run: |
          USER_MEM_DIR="./.hermes/users/${USER_ID}"
          OUTPUTS_DIR="${USER_MEM_DIR}/outputs"
          mkdir -p "${USER_MEM_DIR}" "${OUTPUTS_DIR}"

          if [ -n "${GCP_SA_KEY_BASE64}" ]; then
            echo "${GCP_SA_KEY_BASE64}" | base64 -d > "${USER_MEM_DIR}/service_account.json"
          fi

      - name: 👁️ Execute Vision, OCR & Audio Processing
        run: |
          cat << 'EOF' > multimodal_processor.py
          import os
          import json
          from PIL import Image
          import pytesseract

          user_id = os.getenv("USER_ID")
          media_path = os.getenv("INPUT_MEDIA_PATH")
          outputs_dir = f"./.hermes/users/{user_id}/outputs"

          parsed_media_data = {"ocr_text": "", "audio_transcript": ""}

          if media_path and os.path.exists(media_path) and media_path.lower().endswith(('.png', '.jpg', '.jpeg')):
              img = Image.open(media_path)
              text = pytesseract.image_to_string(img)
              parsed_media_data["ocr_text"] = text.strip()

          out_path = f"./.hermes/users/{user_id}/multimodal_context.json"
          with open(out_path, "w") as f:
              json.dump(parsed_media_data, f, indent=2)
          EOF

          python multimodal_processor.py

      - name: 📅 Sync Google Workspace (Gmail, Calendar, Drive)
        run: |
          cat << 'EOF' > workspace_sync.py
          import os
          import json
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          user_id = os.getenv("USER_ID")
          outputs_dir = f"./.hermes/users/{user_id}/outputs"
          workspace_summary = {"calendar_events": [], "emails": [], "drive_files": []}

          out_path = f"{outputs_dir}/workspace_sync_result.json"
          with open(out_path, "w") as f:
              json.dump(workspace_summary, f, indent=2)
          EOF

          python workspace_sync.py

      - name: 💾 Commit & Synchronize Workspace State
        if: always()
        run: |
          git config --global user.name "hermes-layer3-worker[bot]"
          git config --global user.email "hermes-bot@users.noreply.github.com"

          git add ./.hermes/users/${USER_ID}/

          for i in {1..5}; do
            git commit -m "chore(workspace): sync Layer 3 state & multimodal logs for ${USER_ID} [skip ci]" && break || true
            git pull --rebase origin ${GITHUB_REF_NAME}
            sleep $((RANDOM % 5 + 1))
          done

          git push origin ${GITHUB_REF_NAME} || echo "No changes to commit or push."

      - name: 📤 Upload Layer 3 Sync Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gemini-workspace-artifacts-${{ env.USER_ID }}
          path: ./.hermes/users/${{ env.USER_ID }}/outputs/
          
