name: "Layer 4: Background Orchestration"

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Scheduled job or loop identifier"
        required: true
        type: string
      user_id:
        description: "User ID"
        required: false
        type: string
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: write
  issues: write

jobs:
  execute-orchestration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Master Environment Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /opt/hostedtoolcache/Python/3.11.*/x64
            ~/.cache/pip
            ~/.local/bin
            ~/.hermes
          key: hermes-dagi-master-cache-${{ runner.os }}-
          restore-keys: |
            hermes-dagi-master-cache-${{ runner.os }}-

      - name: Run Background Orchestration Loop
        env:
          OPENAI_BASE_URL: "https://antigravity-seven-delta.vercel.app/v1"
          OPENAI_API_KEY: "dummy-token"
          GITHUB_TOKEN: ${{ secrets.HERMES_PAT || secrets.GITHUB_TOKEN }}
          HERMES_YOLO: "true"
        run: |
          export PATH="$HOME/.local/bin:$HOME/.hermes/bin:$PATH"
          PROMPT="Run background maintenance, codebase self-correction, and audit sequence for job: ${{ inputs.job_id || 'system_cron' }}."
          hermes run --prompt "$PROMPT" --provider openai --yolo 2>&1 | tee bg_execution.log || hermes chat -q "$PROMPT" --provider openai 2>&1 | tee bg_execution.log
