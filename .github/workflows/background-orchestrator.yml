name: "Layer 4 - Background Orchestration & Autonomous Self-Correction"

on:
  schedule:
    - cron: "0 8 * * 1"

  repository_dispatch:
    types: [layer4_background_orchestration]

  workflow_dispatch:
    inputs:
      task_prompt:
        description: "Background task instructions"
        required: true
        type: string
        default: "Generate financial predictions script, run execution, and self-correct syntax or math errors."
      user_id:
        description: "Target user ID for memory partition"
        required: false
        type: string
        default: "default_user"
      max_retries:
        description: "Maximum self-correction attempts"
        required: false
        type: string
        default: "3"

jobs:
  execute-background-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      USER_ID: ${{ inputs.user_id || github.event.client_payload.user_id || 'default_user' }}
      TASK_PROMPT: ${{ inputs.task_prompt || github.event.client_payload.task_prompt }}
      MAX_RETRIES: ${{ inputs.max_retries || github.event.client_payload.max_retries || '3' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CUSTOM_PROXY_URL: "https://antigravity-seven-delta.vercel.v1"

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Restore Pre-Warmed Master Environment Cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/pip
            ~/.npm
            ~/.hermes/env
          key: hermes-dagi-master-cache-ubuntu-latest

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🧠 Restore User Memory Partition
        run: |
          USER_MEM_DIR="./.hermes/users/${USER_ID}"
          OUTPUTS_DIR="${USER_MEM_DIR}/outputs"
          mkdir -p "${USER_MEM_DIR}" "${OUTPUTS_DIR}"

      - name: 🔄 Autonomous Task Execution & Self-Correction Loop
        run: |
          cat << 'EOF' > self_correction_orchestrator.py
          import os
          import sys
          import subprocess
          import requests
          import json

          user_id = os.getenv("USER_ID")
          prompt = os.getenv("TASK_PROMPT")
          max_retries = int(os.getenv("MAX_RETRIES", "3"))
          proxy_url = os.getenv("CUSTOM_PROXY_URL")
          api_key = os.getenv("GEMINI_API_KEY")
          outputs_dir = f"./.hermes/users/{user_id}/outputs"

          target_script = f"{outputs_dir}/generated_task.py"
          initial_code = """# Autonomous Generated Task\nimport math\n\ndef execute_calculation():\n    data = [100, 200, 300, 400]\n    result = sum(data) / len(data)\n    print(f"Calculated Mean: {result}")\n    return result\n\nif __name__ == "__main__":\n    execute_calculation()\n"""
          with open(target_script, "w") as f:
              f.write(initial_code)
          EOF
          python self_correction_orchestrator.py

      - name: 💾 Commit & Synchronize Orchestration Logs
        if: always()
        run: |
          git config --global user.name "hermes-layer4-worker[bot]"
          git config --global user.email "hermes-bot@users.noreply.github.com"
          git add ./.hermes/users/${USER_ID}/
          for i in {1..5}; do
            git commit -m "chore(orchestrator): sync Layer 4 background logs for ${USER_ID} [skip ci]" && break || true
            git pull --rebase origin ${GITHUB_REF_NAME}
            sleep $((RANDOM % 5 + 1))
          done
          git push origin ${GITHUB_REF_NAME} || echo "No changes to commit or push."

      - name: 📤 Upload Background Execution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: background-orchestrator-artifacts-${{ env.USER_ID }}
          path: ./.hermes/users/${{ env.USER_ID }}/outputs/
          
