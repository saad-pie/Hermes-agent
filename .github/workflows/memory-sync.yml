name: "Layer 5: Memory & State Sync"

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: "Isolated User ID key"
        required: true
        type: string
      memory_payload:
        description: "Context to store or update"
        required: true
        type: string

permissions:
  contents: write

jobs:
  execute-memory-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync User Memory Partition
        run: |
          USER_ID=$(echo "${{ inputs.user_id }}" | sed 's/[^a-zA-Z0-9_-]/_/g')
          USER_DIR="./.hermes/users/$USER_ID/memory"
          mkdir -p "$USER_DIR"
          
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "[$TIMESTAMP] ${{ inputs.memory_payload }}" >> "$USER_DIR/state_log.txt"

          git config --global user.name "Hermes Memory Sync"
          git config --global user.email "hermes-memory@users.noreply.github.com"
          
          git fetch origin
          git checkout ${{ github.ref_name }} || git checkout -b ${{ github.ref_name }}
          
          for i in {1..5}; do
            git pull --rebase origin ${{ github.ref_name }} || true
            git add "$USER_DIR"
            if git diff --cached --quiet; then
              echo "No state changes to commit."
              break
            fi
            git commit -m "chore(memory): sync state partition for '$USER_ID' [skip ci]"
            if git push origin ${{ github.ref_name }}; then
              echo "Memory successfully committed!"
              break
            fi
            sleep $((RANDOM % 3 + 1))
          done
          
