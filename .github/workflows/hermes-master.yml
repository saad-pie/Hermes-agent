name: Hermes Master DAGI Autonomous OS Workflow

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      goal:
        description: "Autonomous Goal for Hermes Agent"
        required: true
        type: string
      user_id:
        description: "Firebase UID or User Identifier for Isolated Memory"
        required: false
        type: string
      file_url:
        description: "Optional Direct URL to a file/image/PDF to ingest"
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  checks: write

jobs:
  hermes-dagi-core:
    if: ${{ (github.event_name == 'workflow_dispatch') || (github.event_name == 'schedule') || (contains(github.event.comment.body, '/hermes') && !github.event.comment.user.bot) }}
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Extract PR Ref Context
        if: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request }}
        id: pr_data
        run: |
          PR_URL="${{ github.event.issue.pull_request.url }}"
          PR_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$PR_URL")
          HEAD_REF=$(echo "$PR_JSON" | jq -r .head.ref)
          echo "HEAD_REF=$HEAD_REF" >> $GITHUB_ENV

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_REF || github.ref }}
          fetch-depth: 0

      # -------------------------------------------------------------
      # 🚀 SPEED OPTIMIZATION: CACHE TOOLING & BROWSER BINARIES
      # -------------------------------------------------------------
      - name: Set up Python Runtime with Cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Set up Node.js Runtime with Cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'

      - name: Cache Playwright Chromium Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements.txt', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install System Infrastructure & Security Tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            xvfb x11vnc chromium-browser \
            poppler-utils tesseract-ocr ffmpeg ripgrep xz-utils \
            sqlite3 libsqlite3-dev build-essential clang net-tools
          
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          echo "CHROME_PATH=/usr/bin/chromium-browser" >> $GITHUB_ENV

      - name: Provision Dual-Engine Browser Automation & PDF Parsing
        run: |
          pip install --upgrade pip
          pip install browser-use playwright pypdf pdfplumber pytesseract pillow redis langchain-openai PyGithub
          
          # Install browser binaries only if not hit by cache
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != 'true' ]; then
            playwright install chromium --with-deps
          fi

      - name: Install Official Hermes Agent
        run: |
          curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash || pip install hermes-agent || true
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.hermes/bin" >> $GITHUB_PATH

      - name: Configure Hermes Provider Config for SteveAI
        run: |
          mkdir -p $HOME/.hermes
          cat << 'CONFIG' > $HOME/.hermes/config.yaml
          provider: openai
          model: gemini-3.5-flash-lite
          providers:
            openai:
              base_url: https://antigravity-seven-delta.vercel.app/v1
              api_key: dummy-token
          CONFIG

      # -------------------------------------------------------------
      # 💾 PERSISTENCE: RESTORE USER MEMORY AND FILES
      # -------------------------------------------------------------
      - name: Resolve Active User Context & Restore Per-User Isolated Memory
        run: |
          if [ "${{ github.event_name }}" == "issue_comment" ]; then
            USER_ID="${{ github.event.comment.user.login }}"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            USER_ID="${{ inputs.user_id }}"
            [ -z "$USER_ID" ] && USER_ID="${{ github.actor }}"
          else
            USER_ID="system_cron"
          fi

          USER_ID=$(echo "$USER_ID" | sed 's/[^a-zA-Z0-9_-]/_/g')
          echo "ACTIVE_USER_ID=$USER_ID" >> $GITHUB_ENV

          USER_DIR="./.hermes/users/$USER_ID"
          mkdir -p $HOME/.hermes/skills $HOME/.hermes/memory $HOME/.hermes/fts5 ./workspace/downloads "$USER_DIR/skills" "$USER_DIR/memory" "$USER_DIR/files"

          if [ -d "$USER_DIR/skills" ]; then
            cp -r "$USER_DIR/skills/"* $HOME/.hermes/skills/ 2>/dev/null || true
          fi
          if [ -d "$USER_DIR/memory" ]; then
            cp -r "$USER_DIR/memory/"* $HOME/.hermes/memory/ 2>/dev/null || true
          fi
          if [ -d "$USER_DIR/files" ]; then
            cp -r "$USER_DIR/files/"* ./workspace/downloads/ 2>/dev/null || true
          fi

      - name: Ingest Goal Payload & Process File Assets
        id: parse_payload
        run: |
          USER_FILES="./.hermes/users/$ACTIVE_USER_ID/files"
          mkdir -p ./workspace/downloads "$USER_FILES"

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            GOAL="${{ inputs.goal }}"
            FILE_URL="${{ inputs.file_url }}"
            if [ -n "$FILE_URL" ]; then
              filename=$(basename "$FILE_URL" | cut -d? -f1)
              [ -z "$filename" ] && filename="uploaded_asset"
              curl -sL "$FILE_URL" -o "./workspace/downloads/$filename"
              cp "./workspace/downloads/$filename" "$USER_FILES/"
              GOAL="$GOAL (Ingested file downloaded and saved to ./workspace/downloads/$filename)"
            fi
          elif [ "${{ github.event_name }}" == "schedule" ]; then
            GOAL="Run automated Hermes Cron system maintenance, security audit, and documentation drift checks."
          else
            BODY="${{ github.event.comment.body }}"
            GOAL=$(echo "$BODY" | sed 's/\/hermes//g' | xargs)
            
            URLS=$(echo "$BODY" | grep -oE 'https://[^\s\)]+' || true)
            for url in $URLS; do
              filename=$(basename "$url" | cut -d? -f1)
              if [ -n "$filename" ]; then
                curl -sL "$url" -o "./workspace/downloads/$filename"
                cp "./workspace/downloads/$filename" "$USER_FILES/"
                GOAL="$GOAL (Ingested media asset downloaded and saved to ./workspace/downloads/$filename)"
              fi
            done
          fi
          echo "GOAL=$GOAL" >> $GITHUB_ENV

      # -------------------------------------------------------------
      # 🤖 RUN HERMES ENGINE
      # -------------------------------------------------------------
      - name: Run Autonomous Hermes DAGI Master Engine
        env:
          HERMES_PROVIDER: "openai"
          HERMES_MODEL: "gemini-3.5-flash-lite"
          OPENAI_BASE_URL: "https://antigravity-seven-delta.vercel.app/v1"
          OPENAI_API_KEY: "dummy-token"
          GITHUB_TOKEN: ${{ secrets.HERMES_PAT || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.HERMES_PAT || secrets.GITHUB_TOKEN }}
          HERMES_YOLO: "true"
          HERMES_AUTO_CREATE_SKILLS: "true"
          HERMES_REDIS_URL: "redis://localhost:6379"
          HERMES_MAX_TOKEN_BUDGET: "100000"
          HERMES_HUMAN_IN_THE_LOOP: "false"
          STEALTH_BROWSER_MODE: "true"
        run: |
          PROMPT="[User Context: $ACTIVE_USER_ID] $GOAL"

          if command -v hermes &> /dev/null; then
            hermes chat -q "$PROMPT" --provider openai --model gemini-3.5-flash-lite 2>&1 | tee hermes_execution.log
          elif [ -f "$HOME/.local/bin/hermes" ]; then
            $HOME/.local/bin/hermes chat -q "$PROMPT" --provider openai --model gemini-3.5-flash-lite 2>&1 | tee hermes_execution.log
          else
            python3 -m hermes_agent chat -q "$PROMPT" --provider openai --model gemini-3.5-flash-lite 2>&1 | tee hermes_execution.log || echo "Hermes execution complete."
          fi

      - name: Mask Sensitive Tokens in Output Logs
        if: ${{ always() }}
        run: |
          if [ -f "hermes_execution.log" ]; then
            sed -i -E 's/(ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]+|sk-[A-Za-z0-9]{32,})/[MASKED_SECRET]/g' hermes_execution.log
          fi

      - name: Dispatch Multi-Platform Execution Summary
        if: ${{ always() && github.event_name == 'issue_comment' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = "Execution finished without log trace.";
            if (fs.existsSync('hermes_execution.log')) {
              const fullLog = fs.readFileSync('hermes_execution.log', 'utf8');
              output = fullLog.length > 3500 ? "...\n" + fullLog.slice(-3500) : fullLog;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 **Hermes DAGI Autonomous OS Agent Report**\n*User Context:* \`${process.env.ACTIVE_USER_ID}\`\n\n\`\`\`text\n${output}\n\`\`\``
            });

      # -------------------------------------------------------------
      # 🛡️ COMMIT BACK USER MEMORY & FILES (PRESERVING ALL DATA)
      # -------------------------------------------------------------
      - name: Commit Auto-Synthesized Skills & Persistent User Memory/Files
        if: ${{ always() }}
        run: |
          USER_DIR="./.hermes/users/$ACTIVE_USER_ID"
          mkdir -p "$USER_DIR/skills" "$USER_DIR/memory" "$USER_DIR/files"
          
          cp -r $HOME/.hermes/skills/* "$USER_DIR/skills/" 2>/dev/null || true
          cp -r $HOME/.hermes/memory/* "$USER_DIR/memory/" 2>/dev/null || true

          git config --global user.name "Hermes Master DAGI Agent"
          git config --global user.email "hermes-dagi@users.noreply.github.com"
          
          # Fetch latest remote state to prevent overwriting updates
          git fetch origin
          git checkout ${{ env.HEAD_REF || github.ref_name }}
          git pull --rebase origin ${{ env.HEAD_REF || github.ref_name }} || true

          git add .hermes/
          if ! git diff --cached --quiet; then
            git commit -m "chore(hermes): save persistent user memory & files for '$ACTIVE_USER_ID' [skip ci]"
            git push origin ${{ env.HEAD_REF || github.ref_name }}
          else
            echo "No changes to user memory or persistent files."
          fi
