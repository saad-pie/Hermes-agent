name: Hermes Master DAGI Autonomous OS Workflow

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Optional custom model override (e.g. gemini-3.5-flash)"
        required: false
        type: string
  issue_comment:
    types: [created]
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  checks: write

jobs:
  hermes-dagi-core:
    if: ${{ (github.event_name == 'workflow_dispatch') || (github.event_name == 'schedule') || (contains(github.event.comment.body, '/hermes') && !github.event.comment.user.bot) }}
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Extract PR Ref Context
        if: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request }}
        id: pr_data
        run: |
          PR_URL="${{ github.event.issue.pull_request.url }}"
          PR_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$PR_URL")
          HEAD_REF=$(echo "$PR_JSON" | jq -r .head.ref)
          echo "HEAD_REF=$HEAD_REF" >> $GITHUB_ENV

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_REF || github.ref }}
          fetch-depth: 0

      - name: Install System Infrastructure & Security Tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            xvfb x11vnc chromium-browser \
            poppler-utils tesseract-ocr ffmpeg ripgrep xz-utils \
            sqlite3 libsqlite3-dev build-essential clang net-tools
          
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 1
          echo "DISPLAY=:99" >> $GITHUB_ENV
          echo "CHROME_PATH=/usr/bin/chromium-browser" >> $GITHUB_ENV

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Provision Dual-Engine Browser Automation & Dependencies
        run: |
          pip install --upgrade pip
          pip install browser-use playwright pypdf pdfplumber pytesseract pillow redis langchain-openai PyGithub hermes-agent

      - name: Install Playwright Browsers
        run: |
          playwright install chromium --with-deps

      - name: Install Hermes CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash || pip install hermes-agent || true

      - name: Export Hermes Paths
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.hermes/bin" >> $GITHUB_PATH

      - name: Fetch Models & Pre-flight Health Check
        id: fetch_models
        env:
          INPUT_MODEL: ${{ inputs.model }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          MODELS_JSON=$(curl -s "https://antigravity-seven-delta.vercel.app/api/models")
          echo "$MODELS_JSON" > /tmp/available_models.json

          ACTIVE_MODELS=$(echo "$MODELS_JSON" | jq -r '.data[] | select(.rpm > 0 and .rpd > 0) | .id')

          TARGET_MODEL=""
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "$INPUT_MODEL" ]; then
            TARGET_MODEL="$INPUT_MODEL"
          elif [ "${{ github.event_name }}" == "issue_comment" ]; then
            EXTRACTED_MODEL=$(echo "$COMMENT_BODY" | grep -oE '--model[ =][a-zA-Z0-9.-]+' | awk '{print $2}' || true)
            if [ -n "$EXTRACTED_MODEL" ]; then
              TARGET_MODEL="$EXTRACTED_MODEL"
            fi
          fi

          test_model () {
            local m="$1"
            local res
            res=$(curl -s -w "%{http_code}" -X POST "https://antigravity-seven-delta.vercel.app/v1/chat/completions" \
              -H "Content-Type: application/json" \
              -d "{\"model\": \"$m\", \"messages\": [{\"role\": \"user\", \"content\": \"ping\"}]}" -o /dev/null)
            if [ "$res" -eq 200 ]; then
              return 0
            else
              return 1
            fi
          }

          SELECTED=""
          if [ -n "$TARGET_MODEL" ] && echo "$ACTIVE_MODELS" | grep -q "^${TARGET_MODEL}$"; then
            if test_model "$TARGET_MODEL"; then
              SELECTED="$TARGET_MODEL"
            fi
          fi

          if [ -z "$SELECTED" ]; then
            PREFERRED_LIST="gemini-3.1-flash-lite gemini-2.5-flash gemini-3.5-flash gemma-4-31b-it"
            for candidate in $PREFERRED_LIST; do
              if echo "$ACTIVE_MODELS" | grep -q "^${candidate}$"; then
                if test_model "$candidate"; then
                  SELECTED="$candidate"
                  break
                fi
              fi
            done
          fi

          if [ -z "$SELECTED" ]; then
            SELECTED=$(echo "$ACTIVE_MODELS" | head -n 1)
          fi

          echo "SELECTED_MODEL=$SELECTED" >> $GITHUB_ENV

      - name: Configure Hermes Provider Config for SteveAI
        run: |
          mkdir -p $HOME/.hermes
          cat << CONFIG > $HOME/.hermes/config.yaml
          provider: openai
          model: ${{ env.SELECTED_MODEL }}
          stream: true
          providers:
            openai:
              base_url: https://antigravity-seven-delta.vercel.app/v1
              api_key: dummy-token
          CONFIG

      - name: Resolve Active User Context & Restore Memory
        run: |
          if [ "${{ github.event_name }}" == "issue_comment" ]; then
            USER_ID="${{ github.event.comment.user.login }}"
          else
            USER_ID="system_cron"
          fi

          USER_ID=$(echo "$USER_ID" | sed 's/[^a-zA-Z0-9_-]/_/g')
          echo "ACTIVE_USER_ID=$USER_ID" >> $GITHUB_ENV

          USER_DIR="./.hermes/users/$USER_ID"
          mkdir -p $HOME/.hermes/skills $HOME/.hermes/memory $HOME/.hermes/fts5 ./workspace/downloads "$USER_DIR/skills" "$USER_DIR/memory" "$USER_DIR/files"

          if [ -d "$USER_DIR/skills" ]; then cp -r "$USER_DIR/skills/"* $HOME/.hermes/skills/ 2>/dev/null || true; fi
          if [ -d "$USER_DIR/memory" ]; then cp -r "$USER_DIR/memory/"* $HOME/.hermes/memory/ 2>/dev/null || true; fi
          if [ -d "$USER_DIR/files" ]; then cp -r "$USER_DIR/files/"* ./workspace/downloads/ 2>/dev/null || true; fi

      - name: Ingest Goal Payload & Uploaded Files
        id: parse_payload
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          USER_FILES="./.hermes/users/$ACTIVE_USER_ID/files"
          mkdir -p ./workspace/downloads "$USER_FILES"

          if [ "${{ github.event_name }}" == "schedule" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            GOAL="Run automated Hermes Cron system maintenance, security audit, and documentation drift checks."
          else
            GOAL=$(echo "$COMMENT_BODY" | sed 's/\/hermes//g' | sed -E 's/--model[ =][a-zA-Z0-9.-]+//g' | xargs)
            
            URLS=$(echo "$COMMENT_BODY" | grep -oE 'https://[^\s\)]+' || true)
            for url in $URLS; do
              filename=$(basename "$url" | cut -d? -f1)
              if [ -n "$filename" ]; then
                curl -sL "$url" -o "./workspace/downloads/$filename"
                cp "./workspace/downloads/$filename" "$USER_FILES/"
                GOAL="$GOAL (Ingested media asset downloaded and saved to ./workspace/downloads/$filename)"
              fi
            done
          fi
          
          if [ -d "./uploads" ]; then
            cp -r ./uploads/* ./workspace/downloads/ 2>/dev/null || true
            cp -r ./uploads/* "$USER_FILES/" 2>/dev/null || true
          fi
          
          EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "GOAL<<$EOF_MARKER" >> $GITHUB_ENV
          echo "$GOAL" >> $GITHUB_ENV
          echo "$EOF_MARKER" >> $GITHUB_ENV

      - name: Run Autonomous Hermes Master Engine
        env:
          HERMES_PROVIDER: "openai"
          HERMES_MODEL: ${{ env.SELECTED_MODEL }}
          HERMES_STREAM: "true"
          OPENAI_BASE_URL: "https://antigravity-seven-delta.vercel.app/v1"
          OPENAI_API_KEY: "dummy-token"
          GITHUB_TOKEN: ${{ secrets.HERMES_PAT || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.HERMES_PAT || secrets.GITHUB_TOKEN }}
          HERMES_YOLO: "true"
          HERMES_AUTO_CREATE_SKILLS: "true"
          HERMES_REDIS_URL: "redis://localhost:6379"
          HERMES_MAX_TOKEN_BUDGET: "100000"
          HERMES_HUMAN_IN_THE_LOOP: "false"
          STEALTH_BROWSER_MODE: "true"
          HERMES_MAX_RETRIES: "8"
          HERMES_RETRY_DELAY: "5"
        run: |
          PROMPT="[User Context: $ACTIVE_USER_ID] $GOAL. Available files in workspace/downloads: $(ls -la ./workspace/downloads 2>/dev/null || echo 'None')"

          if command -v hermes &> /dev/null; then
            hermes chat -q "$PROMPT" --provider openai --model "${{ env.SELECTED_MODEL }}" 2>&1 | tee hermes_execution.log
          elif [ -f "$HOME/.local/bin/hermes" ]; then
            $HOME/.local/bin/hermes chat -q "$PROMPT" --provider openai --model "${{ env.SELECTED_MODEL }}" 2>&1 | tee hermes_execution.log
          else
            python3 -m hermes_agent chat -q "$PROMPT" --provider openai --model "${{ env.SELECTED_MODEL }}" 2>&1 | tee hermes_execution.log || echo "Hermes execution complete."
          fi

      - name: Secure Attachment Parser & JSON Builder
        if: ${{ always() }}
        run: |
          if [ -f "hermes_execution.log" ]; then
            sed -i -E 's/(ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]+|sk-[A-Za-z0-9]{32,})/[MASKED_SECRET]/g' hermes_execution.log
          fi

          python3 - << 'EOF'
          import re, json, os, subprocess, datetime

          log_file = "hermes_execution.log"
          raw_log = open(log_file, "r").read() if os.path.exists(log_file) else ""

          hermes_match = re.search(r'╭─ ⚕ Hermes ─+([\s\S]*?)╰─+', raw_log)
          clean_answer = hermes_match.group(1).strip() if hermes_match else raw_log.strip()

          thoughts = []
          for line in raw_log.split("\n"):
              line_str = line.strip()
              if any(k in line_str.lower() for k in ["searched", "executing", "running", "thought", "tool", "query"]):
                  now_str = datetime.datetime.now().strftime("%H:%M:%S")
                  thoughts.append({"timestamp": now_str, "action": re.sub(r'\x1b\[[0-9;]*m', '', line_str)[:120]})

          raw_repo = os.environ.get("GITHUB_REPOSITORY", "")
          ref_name = os.environ.get("HEAD_REF") or os.environ.get("GITHUB_REF_NAME", "main")
          attachments = []

          blacklisted_files = {
              "ask_execution.log", "hermes_execution.log", "agent_response.json",
              "package.json", "package-lock.json"
          }

          try:
              git_status = subprocess.check_output(["git", "status", "--porcelain"], text=True)
              for line in git_status.split("\n"):
                  if not line.strip():
                      continue
                  filepath = line.strip().split()[-1]
                  
                  if any(filepath.startswith(prefix) for prefix in [".git/", ".hermes/", "workspace/downloads/", "node_modules/", "/tmp/"]):
                      continue
                  if os.path.basename(filepath) in blacklisted_files:
                      continue

                  if os.path.isfile(filepath):
                      size_bytes = os.path.getsize(filepath)
                      size_str = f"{size_bytes / 1024:.1f} KB" if size_bytes > 1024 else f"{size_bytes} B"
                      raw_url = f"https://raw.githubusercontent.com/{raw_repo}/{ref_name}/{filepath}"
                      
                      _, ext = os.path.splitext(filepath)
                      file_type = ext.replace(".", "").upper() if ext else "FILE"

                      attachments.append({
                          "fileName": filepath,
                          "fileSize": size_str,
                          "fileType": file_type,
                          "downloadUrl": raw_url
                      })
          except Exception as e:
              print(f"Error detecting git files: {e}")

          payload = {
              "status": "completed",
              "user_id": os.environ.get("ACTIVE_USER_ID", "system_cron"),
              "model": os.environ.get("SELECTED_MODEL", ""),
              "text_response": clean_answer,
              "thoughts": thoughts[:20],
              "attachments": attachments
          }

          with open("agent_response.json", "w") as f:
              json.dump(payload, f, indent=2)
          EOF

      - name: Dispatch Execution Summary
        if: ${{ always() && github.event_name == 'issue_comment' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let payload = { text_response: "Execution finished without log trace.", attachments: [], thoughts: [] };
            if (fs.existsSync('agent_response.json')) {
              payload = JSON.parse(fs.readFileSync('agent_response.json', 'utf8'));
            }

            let attachmentsMd = "";
            if (payload.attachments && payload.attachments.length > 0) {
              attachmentsMd = "### 📄 Attached Artifacts\n" + payload.attachments.map(a => 
                `- 📎 [ **${a.fileName}** ](${a.downloadUrl}) (\`${a.fileType}\` • \`${a.fileSize}\`)`
              ).join("\n") + "\n\n";
            }

            let thoughtsMd = "";
            if (payload.thoughts && payload.thoughts.length > 0) {
              thoughtsMd = "<details><summary><b>🔍 View Execution Trace & Thoughts</b></summary>\n\n```text\n" + 
                payload.thoughts.map(t => `[${t.timestamp}] ${t.action}`).join("\n") + 
                "\n```\n</details>\n\n";
            }

            const body = `🚀 **Hermes DAGI Autonomous OS Agent Report**\n\n${attachmentsMd}${payload.text_response}\n\n${thoughtsMd}*User Context:* \`${process.env.ACTIVE_USER_ID}\` | *Active Model:* \`${process.env.SELECTED_MODEL}\``;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Commit State & User Memory
        if: ${{ always() }}
        run: |
          set +e
          USER_DIR="./.hermes/users/$ACTIVE_USER_ID"
          mkdir -p "$USER_DIR/skills" "$USER_DIR/memory" "$USER_DIR/files"
          
          cp -r $HOME/.hermes/skills/* "$USER_DIR/skills/" 2>/dev/null || true
          cp -r $HOME/.hermes/memory/* "$USER_DIR/memory/" 2>/dev/null || true

          git config --global user.name "Hermes Master DAGI Agent"
          git config --global user.email "hermes-dagi@users.noreply.github.com"
          
          TARGET_BRANCH="${{ env.HEAD_REF }}"
          if [ -z "$TARGET_BRANCH" ]; then
            TARGET_BRANCH="${{ github.ref_name }}"
          fi

          git fetch origin
          git checkout "$TARGET_BRANCH" || git checkout -b "$TARGET_BRANCH"
          git pull --rebase origin "$TARGET_BRANCH" || true

          git add .
          git reset ask_execution.log hermes_execution.log agent_response.json 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "chore(hermes): save persistent user memory & files for '$ACTIVE_USER_ID' [skip ci]"
            git push origin "$TARGET_BRANCH"
          else
            echo "No changes to user memory or persistent files."
          fi
          exit 0

      - name: Cache Complete Environment State for Hermes Ask
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: |
            /opt/hostedtoolcache/Python/3.11.*/x64
            ~/.cache/pip
            ~/.cache/ms-playwright
            ~/.local/bin
            ~/.hermes
          key: hermes-dagi-master-cache-v1
