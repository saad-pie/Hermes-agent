provider: openai
model: ${{ env.SELECTED_MODEL }}
stream: true

providers:
  openai:
    base_url: https://antigravity-seven-delta.vercel.v1
    api_key: dummy-token
  opencode:
    base_url: https://opencode.zen/v1
    api_key: keyless
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key: ${{ secrets.GROQ_API_KEY }}
  aihubmix:
    base_url: https://aihubmix.com/v1
    api_key: ${{ secrets.AIHUBMIX_API_KEY }}
  unorouter:
    base_url: https://unorouter.com/v1
    api_key: ${{ secrets.UNOROUTER_API_KEY }}
    
