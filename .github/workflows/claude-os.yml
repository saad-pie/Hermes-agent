name: "Layer 1: Claude Environment Execution"

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Terminal or code task to execute"
        required: true
        type: string
      user_id:
        description: "Target User ID"
        required: false
        type: string
      model:
        description: "Optional Model Override"
        required: false
        type: string
      issue_number:
        description: "GitHub Issue/PR Number to reply to"
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

jobs:
  execute-claude-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Master Environment Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /opt/hostedtoolcache/Python/3.11.*/x64
            ~/.cache/pip
            ~/.cache/ms-playwright
            ~/.local/bin
            ~/.hermes
          key: hermes-dagi-master-cache-${{ runner.os }}-
          restore-keys: |
            hermes-dagi-master-cache-${{ runner.os }}-

      - name: Ensure Infrastructure
        run: |
          export PATH="$HOME/.local/bin:$HOME/.hermes/bin:$PATH"
          if ! command -v hermes &> /dev/null; then
            pip install hermes-agent playwright
          fi

      - name: Execute Autonomous Terminal Task
        env:
          HERMES_PROVIDER: "openai"
          HERMES_MODEL: ${{ inputs.model || 'gemini-3.1-flash-lite' }}
          OPENAI_BASE_URL: "https://antigravity-seven-delta.vercel.app/v1"
          OPENAI_API_KEY: "dummy-token"
          GITHUB_TOKEN: ${{ secrets.HERMES_PAT || secrets.GITHUB_TOKEN }}
          HERMES_YOLO: "true"
        run: |
          export PATH="$HOME/.local/bin:$HOME/.hermes/bin:$PATH"
          USER_ID=$(echo "${{ inputs.user_id || 'public_user' }}" | sed 's/[^a-zA-Z0-9_-]/_/g')
          PROMPT="[User Context: $USER_ID] Execute terminal command/task: ${{ inputs.command }}"
          hermes run --prompt "$PROMPT" --provider openai --yolo 2>&1 | tee claude_execution.log || hermes chat -q "$PROMPT" --provider openai 2>&1 | tee claude_execution.log

      - name: Post Execution Comment
        if: ${{ always() && inputs.issue_number != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const logContent = fs.existsSync('claude_execution.log') ? fs.readFileSync('claude_execution.log', 'utf8') : 'Execution complete.';
            const sanitized = logContent.replace(/(ghp_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{32,})/g, '[MASKED]');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: `⚙️ **Layer 1 (Claude OS) Execution Summary**\n\n\`\`\`text\n${sanitized.slice(-2000)}\n\`\`\``
            });
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
